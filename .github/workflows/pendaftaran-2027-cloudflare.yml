name: "Pendaftaran Tahun 1 2027 - Deploy Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_pendaftaran:
    name: "Publish Registration Portal"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MAPEM_D1_DATABASE_ID: ${{ vars.MAPEM_D1_DATABASE_ID }}
      MAPEM_ADMIN_EMAILS: ${{ secrets.MAPEM_ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source and tests
        run: |
          node --check 'registration-site/functions/api/[[path]].js'
          node --check public/pendaftaran-tahun1-2027/import2027.mjs
          node --test tests/registration2027.test.mjs
      - name: Install Cloudflare Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Configure isolated Cloudflare Pages project
        run: node .github/scripts/setup-registration-pages.mjs
      - name: Build deployment directory
        run: |
          mkdir -p .registration-deploy/public/assets .registration-deploy/functions/api
          cp public/pendaftaran-tahun1-2027/index.html .registration-deploy/public/index.html
          cp public/pendaftaran-tahun1-2027/import2027.mjs .registration-deploy/public/import2027.mjs
          cp public/pendaftaran-tahun1-2027/_headers .registration-deploy/public/_headers
          cp public/pendaftaran-tahun1-2027/assets/header-pendaftaran-2027.png .registration-deploy/public/assets/header-pendaftaran-2027.png
          cp public/pendaftaran-tahun1-2027/assets/logo-sekolah.webp .registration-deploy/public/assets/logo-sekolah.webp
          test -s .registration-deploy/public/assets/header-pendaftaran-2027.png
          test -s .registration-deploy/public/assets/logo-sekolah.webp
          cp 'registration-site/functions/api/[[path]].js' '.registration-deploy/functions/api/[[path]].js'
          cp functions/api/_registration2027.js .registration-deploy/functions/api/_registration2027.js
      - name: Deploy independent portal
        run: |
          cd .registration-deploy
          ../node_modules/.bin/wrangler pages deploy public --project-name pendaftaran-tahun1-2027-skpt --branch main
      - name: Check online portal database connectivity
        run: |
          curl -fsS --max-time 20 https://pendaftaran-tahun1-2027-skpt.pages.dev/api/health > /tmp/year1-health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/year1-health.json"));if(!(h.ok&&h.databaseBound&&h.databaseConnected))process.exit(1);console.log("Year 1 registration portal ready");'
          # Verify that both supplied branded images are publicly served, not missing assets.
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/header-pendaftaran-2027.png -o /tmp/registration-banner-live.png
          test "$(wc -c < /tmp/registration-banner-live.png)" -ge 200000
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/logo-sekolah.webp -o /tmp/registration-logo-live.webp
          test "$(wc -c < /tmp/registration-logo-live.webp)" -ge 5000
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/ | grep -q 'header-pendaftaran-2027.png'
          echo "Banner asal sekolah, logo beranimasi dan halaman Pendaftaran 2027 telah disahkan."
