name: "Pendaftaran Tahun 1 2027 - Deploy Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_pendaftaran:
    name: "Publish Registration Portal"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MAPEM_D1_DATABASE_ID: ${{ vars.MAPEM_D1_DATABASE_ID }}
      MAPEM_ADMIN_EMAILS: ${{ secrets.MAPEM_ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source and tests
        run: |
          node --check 'registration-site/functions/api/[[path]].js'
          node --check public/pendaftaran-tahun1-2027/import2027.mjs
          node --test tests/registration2027.test.mjs
      - name: Install Cloudflare Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Configure isolated Cloudflare Pages project
        run: node .github/scripts/setup-registration-pages.mjs
      - name: Build deployment directory
        run: |
          mkdir -p .registration-deploy/public/assets .registration-deploy/functions/api
          cp public/pendaftaran-tahun1-2027/index.html .registration-deploy/public/index.html
          mkdir -p .registration-deploy/public/ibu-bapa
          cp public/pendaftaran-tahun1-2027/ibu-bapa/index.html .registration-deploy/public/ibu-bapa/index.html
          mkdir -p .registration-deploy/public/bot-admin
          cp public/pendaftaran-tahun1-2027/bot-admin/index.html .registration-deploy/public/bot-admin/index.html
          cp public/pendaftaran-tahun1-2027/import2027.mjs .registration-deploy/public/import2027.mjs
          cp public/pendaftaran-tahun1-2027/bot2027.mjs .registration-deploy/public/bot2027.mjs
          cp public/pendaftaran-tahun1-2027/bot2027.css .registration-deploy/public/bot2027.css
          cp public/pendaftaran-tahun1-2027/manifest.webmanifest .registration-deploy/public/manifest.webmanifest
          cp public/pendaftaran-tahun1-2027/sw.js .registration-deploy/public/sw.js
          cp public/pendaftaran-tahun1-2027/pwa2027.mjs .registration-deploy/public/pwa2027.mjs
          cp public/pendaftaran-tahun1-2027/pwa2027.css .registration-deploy/public/pwa2027.css
          mkdir -p .registration-deploy/public/icons
          cp public/pendaftaran-tahun1-2027/icons/*.png .registration-deploy/public/icons/
          test -s .registration-deploy/public/icons/icon-192.png
          test -s .registration-deploy/public/icons/icon-512.png
          test -s .registration-deploy/public/icons/icon-maskable-512.png
          test -s .registration-deploy/public/icons/apple-touch-icon.png
          cp public/pendaftaran-tahun1-2027/assets/cikgu-wanwan-bot.gif .registration-deploy/public/assets/cikgu-wanwan-bot.gif
          cp public/pendaftaran-tahun1-2027/assets/cikgu-wanwan-bot-v2.gif .registration-deploy/public/assets/cikgu-wanwan-bot-v2.gif
          cp public/pendaftaran-tahun1-2027/assets/cikgu-wanwan-bot-v2-still.webp .registration-deploy/public/assets/cikgu-wanwan-bot-v2-still.webp
          test -s .registration-deploy/public/assets/cikgu-wanwan-bot-v2.gif
          test -s .registration-deploy/public/assets/cikgu-wanwan-bot-v2-still.webp
          test -s .registration-deploy/public/assets/cikgu-wanwan-bot.gif
          cp public/pendaftaran-tahun1-2027/_headers .registration-deploy/public/_headers
          cp public/pendaftaran-tahun1-2027/assets/header-pendaftaran-2027-logo-rasmi.webp .registration-deploy/public/assets/header-pendaftaran-2027-logo-rasmi.webp
          cp public/pendaftaran-tahun1-2027/assets/logo-sekolah-rasmi-2027.webp .registration-deploy/public/assets/logo-sekolah-rasmi-2027.webp
          test -s .registration-deploy/public/assets/header-pendaftaran-2027-logo-rasmi.webp
          test -s .registration-deploy/public/assets/logo-sekolah-rasmi-2027.webp
          cp 'registration-site/functions/api/[[path]].js' '.registration-deploy/functions/api/[[path]].js'
          cp registration-site/functions/api/_ai2027.js .registration-deploy/functions/api/_ai2027.js
          cp functions/api/_registration2027.js .registration-deploy/functions/api/_registration2027.js
      - name: Configure Workers AI and D1 bindings for Pages
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAPEM_D1_DATABASE_ID"
          cat > .registration-deploy/wrangler.toml <<EOF
          name = "pendaftaran-tahun1-2027-skpt"
          pages_build_output_dir = "./public"
          compatibility_date = "2026-11-16"
          [ai]
          binding = "AI"
          [[d1_databases]]
          binding = "DB"
          database_name = "mapemskpt2026"
          database_id = "$MAPEM_D1_DATABASE_ID"
          EOF
      - name: Deploy independent portal
        run: |
          cd .registration-deploy
          ../node_modules/.bin/wrangler pages deploy public --project-name pendaftaran-tahun1-2027-skpt --branch main
      - name: Check online portal database connectivity
        run: |
          curl -fsS --max-time 20 https://pendaftaran-tahun1-2027-skpt.pages.dev/api/health > /tmp/year1-health.json
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/manifest.webmanifest > /tmp/year1-pwa-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("/tmp/year1-pwa-manifest.json"));if(m.display!=="standalone"||m.start_url!=="/"||m.icons.length<3||!m.icons.some(i=>i.purpose==="maskable"))process.exit(1);console.log("PWA Android/iOS manifest validated");'
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/sw.js -o /tmp/year1-pwa-sw.js
          grep -F 'isAllowed(request,url)' /tmp/year1-pwa-sw.js > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/icons/icon-192.png -o /tmp/year1-pwa-icon-192.png
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/icons/icon-512.png -o /tmp/year1-pwa-icon-512.png
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/icons/icon-maskable-512.png -o /tmp/year1-pwa-icon-maskable.png
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/icons/apple-touch-icon.png -o /tmp/year1-pwa-apple-touch.png
          test "$(wc -c < /tmp/year1-pwa-icon-192.png)" -gt 15000
          test "$(wc -c < /tmp/year1-pwa-icon-512.png)" -gt 70000
          test "$(wc -c < /tmp/year1-pwa-apple-touch.png)" -gt 15000
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/pwa2027.mjs | grep -F 'beforeinstallprompt' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/pwa2027.css | grep -F 'pwa-install-dialog' > /dev/null
          echo "Android dan iOS PWA installation assets verified."
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/year1-health.json"));if(!(h.ok&&h.databaseBound&&h.databaseConnected))process.exit(1);console.log("Year 1 registration portal ready");'
          # Verify that both supplied branded images are publicly served, not missing assets.
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/header-pendaftaran-2027-logo-rasmi.webp -o /tmp/registration-banner-live.webp
          test "$(wc -c < /tmp/registration-banner-live.webp)" -ge 200000
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/logo-sekolah-rasmi-2027.webp -o /tmp/registration-logo-live.webp
          test "$(wc -c < /tmp/registration-logo-live.webp)" -ge 5000
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/ | grep -F 'header-pendaftaran-2027-logo-rasmi.webp' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/ibu-bapa/ | grep -F 'Paparan Ibu Bapa' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/bot-admin/ | grep -F 'Soalan & Jawapan Delima PTG BOT' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/bot2027.mjs | grep -F 'answerRegistrationQuestion' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/bot2027.css | grep -F 't1chat-panel' > /dev/null
          curl --fail --silent --show-error --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/cikgu-wanwan-bot.gif -o /tmp/cikgu-wanwan-bot-live.gif
          test "$(wc -c < /tmp/cikgu-wanwan-bot-live.gif)" -ge 200000
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/cikgu-wanwan-bot-v2.gif -o /tmp/cikgu-wanwan-bot-v2.gif
          test "$(wc -c < /tmp/cikgu-wanwan-bot-v2.gif)" -ge 180000
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/assets/cikgu-wanwan-bot-v2-still.webp -o /tmp/cikgu-wanwan-bot-v2-still.webp
          test "$(wc -c < /tmp/cikgu-wanwan-bot-v2-still.webp)" -ge 10000
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/bot2027.mjs | grep -F '/assets/cikgu-wanwan-bot-v2.gif' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/bot2027.css | grep -F 'font-size:11px!important' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/bot2027.mjs | grep -F 'Delima PTG BOT' > /dev/null
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/api/public/assistant > /tmp/year1-bot.json
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/api/public/ai > /tmp/year1-ai-status.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/year1-ai-status.json"));if(d.available!==true)process.exit(1);console.log("Cloudflare Workers AI binding active");'
          curl --fail --silent --show-error --max-time 30 -X POST https://pendaftaran-tahun1-2027-skpt.pages.dev/api/public/ai \
            -H 'Origin: https://pendaftaran-tahun1-2027-skpt.pages.dev' \
            -H 'Content-Type: application/json' \
            --data '{"question":"Siapa guru kelas 1 Ruby?"}' > /tmp/year1-ai-smoke.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/year1-ai-smoke.json"));if(d.mode!=="ai"||!d.text||d.text.length<8){console.error("AI returned fallback:",d.reason||"unknown");process.exit(1);}console.log("Workers AI answered a real public registration question");'


          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/year1-bot.json"));if(d.teachers?.length!==9||!Array.isArray(d.teachers)||d.teachers.some(t=>"gambarPasport" in t))process.exit(1);console.log("Bot FAQ data validated");'
          curl -fsS --max-time 25 https://pendaftaran-tahun1-2027-skpt.pages.dev/api/public/teachers > /tmp/year1-teachers.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/year1-teachers.json"));if(d.teachers?.length!==9||d.teachers.some(t=>!t.namaGuru))process.exit(1);console.log("9 guru kelas tersedia dan paparan ibu bapa tersambung.");'
          echo "Banner sekolah, logo, 9 guru kelas dan portal ibu bapa disahkan."
