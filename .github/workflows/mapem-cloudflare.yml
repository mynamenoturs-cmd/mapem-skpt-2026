name: MaPeM - Ujian, Migrasi D1 dan Deploy Pages

on:
  push:
    branches: [main, feat/tahap2-20261023]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapem-production
  cancel-in-progress: false

jobs:
  test:
    name: Semak kod dan ujian keselamatan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Semak sintaks aplikasi
        run: npm run check
      - name: Ujian kawalan akses dan database tempatan
        run: npm test

  deploy:
    name: Migrasi dan deployment Cloudflare
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MAPEM_D1_DATABASE_ID: ${{ vars.MAPEM_D1_DATABASE_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MAPEM_ADMIN_EMAILS: ${{ secrets.MAPEM_ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - name: Semak konfigurasi rahsia
        id: ready
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$MAPEM_D1_DATABASE_ID" ]]; then
            echo "::error::Konfigurasi Cloudflare belum lengkap. Semak CLOUDFLARE_API_TOKEN (secret), CLOUDFLARE_ACCOUNT_ID dan MAPEM_D1_DATABASE_ID (variables) pada repository Actions."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Kredensial Cloudflare tersedia (nilai rahsia tidak dipaparkan)."

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.enabled == 'true'
        with:
          node-version: '24'

      - name: Pasang Wrangler
        if: steps.ready.outputs.enabled == 'true'
        run: npm install --no-save --no-package-lock wrangler@4 sharp@0.34.4

      - name: Sediakan konfigurasi D1 sementara
        if: steps.ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MAPEM_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::MAPEM_D1_DATABASE_ID mesti UUID D1 database mapemskpt2026."
            exit 1
          fi
          cat > .wrangler-ci.toml <<EOF
          name = "mapem-skpt-2026"
          compatibility_date = "2026-10-15"
          [[d1_databases]]
          binding = "DB"
          database_name = "mapemskpt2026"
          database_id = "$MAPEM_D1_DATABASE_ID"
          migrations_dir = "migrations"
          EOF
          echo "Konfigurasi D1 sementara disediakan. Tiada kunci rahsia ditulis ke kod sumber."

      - name: Migrasi database production (pelihara rekod asal)
        if: steps.ready.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler-ci.toml

      - name: Sahkan 42 kelas aktif (26 Tahap 1 + 16 Tahap 2)
        if: steps.ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config .wrangler-ci.toml --command "SELECT COUNT(*) AS kelas_aktif FROM classes WHERE year BETWEEN 1 AND 5; SELECT year, COUNT(*) AS kelas FROM classes WHERE year BETWEEN 1 AND 5 GROUP BY year ORDER BY year;"
          npx wrangler d1 execute DB --remote --config .wrangler-ci.toml --command "SELECT CASE WHEN (SELECT COUNT(*) FROM classes WHERE year BETWEEN 1 AND 5)=42 AND (SELECT COUNT(*) FROM classes WHERE year=4)=8 AND (SELECT COUNT(*) FROM classes WHERE year=5)=8 AND (SELECT COUNT(*) FROM classes WHERE year IN (4,5) AND lower(name)='amber')=0 THEN 'LULUS' ELSE 'GAGAL' END AS audit;"
          # Any Year 6 records with real data are retained in the DB as archive and are never shown in portal.
          npx wrangler d1 execute DB --remote --config .wrangler-ci.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','teacher_assignments','sessions','oauth_states','publications') ORDER BY name;"

      - name: Pautkan D1 secara automatik kepada Pages Production
        if: steps.ready.outputs.enabled == 'true'
        run: node .github/scripts/bind-pages-d1.mjs

      - name: Konfigurasi Google Login dan APP_ORIGIN secara automatik
        if: steps.ready.outputs.enabled == 'true'
        run: node .github/scripts/configure-google-oauth.mjs

      - name: Jana banner MaPeM, logo piala dan ikon aplikasi PNG
        if: steps.ready.outputs.enabled == 'true'
        run: node scripts/build-brand.mjs

      - name: Terbit ke Cloudflare Pages sedia ada
        if: steps.ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .wrangler-ci.toml
          npx wrangler pages deploy public --project-name mapem-skpt-2026 --branch main

      - name: Semak API selepas deployment
        if: steps.ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if health="$(curl -fsS --max-time 15 "https://mapem-skpt-2026.pages.dev/api/health")"; then
              echo "$health"
              if node -e 'const h=JSON.parse(process.argv[1]);if(h.ok!==true||h.databaseBound!==true||h.databaseConnected!==true||h.configured!==true){process.exit(1)}' "$health"; then
                echo "MaPeM Production D1 dan Google OAuth dikonfigurasi dengan lengkap."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::API /api/health tidak dapat diakses."
          exit 1
